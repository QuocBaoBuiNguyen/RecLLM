model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna  # legacy key — `_init_llm_model` uses AutoModel, any HF causal LM works.
  llm_model: "/content/SigLLM/ckpt/llm/vicuna-7b-v1.5"
  prompt_path: "/content/SigLLM/prompts/qformer_prompt_book_vanilla.txt"
  # Vicuna-7B-v1.5 IS instruction-tuned (this run reproduces CoLLM's backbone).
  # Restore the standard Vicuna USER/ASSISTANT chat wrapping so the model emits
  # the "Yes"/"No" label as an assistant turn. NOTE: CoLLM's paper used
  # vicuna-7b-v1.1 (LLaMA-1); v1.5 (LLaMA-2) is the freely-mergeable modern
  # equivalent, so numbers may differ slightly from the paper. To revert to the
  # Qwen base run, restore llm_model=qwen2-7b-base + prompt_template='{} Answer:'
  # + prompt_path=qformer_prompt_book_mt.txt.
  prompt_template: "A chat between a curious user and an artificial intelligence assistant. The assistant gives helpful, detailed, and polite answers to the user's questions. USER: {} ASSISTANT:"
  
  freeze_rec: True
  freeze_proj: False

  # Stage 3 ablation switch. When True, target_llm and interacted_llm_flat
  # are zeroed right after llm_proj, so every soft-token slot in the prompt
  # carries a zero vector instead of the projected Q-Former output. Use this
  # to measure the marginal contribution of soft tokens at inference: load a
  # trained checkpoint, flip this to True, re-evaluate. If AUC barely drops,
  # the Q-Former isn't contributing — the LLM is leaning on prompt text alone.
  ablate_soft_tokens: False

  # CoLLM-style 2-step tuning. Each Stage 3 pipeline script overrides this
  # from its own `run.qformer_stage3_step{1,2}` block (see
  # `apply_step{1,2}_overrides` in the two scripts). Leave null at top level —
  # the model only enforces a step policy when this is explicitly 1 or 2.
  tuning_step: null

  lora_config:
    use_lora: True
    # Reverted to r=8 [q,v] after A ablation: r=16 [q,k,v,o] (10M trainable
    # LoRA) overfit on 33k ML1M samples — val uAUC peaked at 0.7048 vs r=8
    # baseline 0.7077, with train loss dropping ~2x faster than r=8.
    # Conclusion: LoRA capacity is NOT the bottleneck; Q-Former Stage 1
    # quality is (now addressed by 8 layers + user-item contrastive).
    r: 8
    alpha: 16
    target_modules: [q_proj, v_proj]
    dropout: 0.05

  max_txt_len: 1024
  end_sym: "###"
  ans_type: "v2"

  # uAUC-aligned objective for Stage 3. L = BCE + weight * per-user pairwise BPR
  # (a differentiable AUC surrogate over the Yes/No margin). weight=0.0 -> the
  # original pointwise BCE. Requires run.user_grouped_batch so batches contain
  # same-user pos/neg pairs, otherwise the term has no pairs to act on.
  # Kept at 0.0 here to ISOLATE the rank-preserving alignment loss below.
  ranking_loss:
    weight: 0.0
    tau: 1.0

  # Rank-preserving collaborative-ALIGNMENT loss. Unlike ranking_loss (which
  # shapes the LLM's Yes/No output margin), this reads a scalar off the ALIGNED
  # CF soft tokens (pre-LLM, the user-conditioned Q-Former output) and imposes a
  # per-user BPR on THEM, so the collaborative alignment itself preserves
  # within-user ordering. This directly attacks the user-conditioned failure
  # mode: the additive per-user shift cancels in uAUC but adds cross-user AUC
  # noise; this loss makes the shift earn within-user discrimination instead.
  # Gated to Step 2 (where Q-Former/proj are trainable). weight=0.0 -> disabled.
  # Default OFF for the first Amazon-Book runs: establish vanilla + user-conditioned
  # (Run-1) baselines first, then flip to 0.2 + user_grouped_batch=true for Run-2.
  align_rank_loss:
    # Run-2 (book): flipped ON to push uAUC. Per-user BPR on the aligned CF soft
    # tokens forces within-user ordering — the exact gap on book (AUC 0.81 high,
    # uAUC low). Step-2 only (Q-Former/proj trainable); reuses Stage-1/2 + LoRA.
    # Requires user_grouped_batch.enabled=true (below) so batches hold same-user
    # pos/neg pairs. Was negative on movie (little uAUC headroom); book untested.
    weight: 0.2
    tau: 1.0

  # P0 cold-ITEM token — this is the book-side lever. 29.3% of Amazon-Book test
  # rows have a target item absent from train_ood2, so the frozen MF teacher
  # never trained that row; Adam's coupled weight_decay then decays it to ~0
  # (dense embedding grads), and proj_cf maps EVERY such item onto the same
  # constant token. The CF channel therefore cannot separate two cold items of
  # one user — which is what pins test_cold uAUC at 0.5258 (vs test_warm 0.6238)
  # while global AUC survives on cross-user spread. When True those rows get a
  # learned zero-init "no-CF" vector instead, so "no signal" becomes a state the
  # LLM can recognise rather than a bias vector it reads as an item id.
  # Pair with `datasets.book_ood.build_info.mark_cold_items: true`.
  # Zero-init => at step 0 the token is 0, numerically what the decayed MF row
  # already supplied, so there is no warm-start jolt. Step-2 retrain only.
  cold_item_token: false

  proj_token_num: ${model.qformer_config.num_queries}

  rec_model: "MF"
  user_num: -100
  item_num: -100

  qformer_config:
    use_qformer: True
    qformer_ckpt: "${run.qformer_stage2.output_dir}${run.qformer_stage2.qformer_ckpt_out}" # Q-Former weights after Stage 2 generative pretraining
    llm_proj_ckpt: "${run.qformer_stage2.output_dir}${run.qformer_stage2.proj_ckpt_out}" # Projection weights after Stage 2 generative pretraining
    qformer_d_model: 768
    qformer_output_dim: 768 # Keep Q-Former compact; llm_proj maps this to the LLM hidden size.
    qformer_text_model_name: "bert-base-uncased"
    max_instruction_length: 48
    num_queries: 8
    num_heads: 8
    num_layers: 4
    user_conditioned: True

    # P1 content bridge (target item only). Stage 3 was sending a GENERIC
    # template into the Q-Former text branch, so a cold item (29.3% of book test
    # rows) gave the Q-Former no item-specific input at all: cf_vec ~ 0 plus a
    # constant string -> identical soft tokens for every cold item. That is why
    # cold candidates cannot be ranked against each other, and why P0 could not
    # move test_cold (95.2% of its eligible users have ALL items cold).
    # This feeds the item's own "Title: X. Genres: Y." — the exact text Stage 1
    # trained this branch on (ITC/ITM/ITG), through the same forward_multimodal
    # path. Zero new parameters, zero shape changes.
    # LIMIT: Amazon-Book ships a CONSTANT synthetic genres field, so the
    # per-item signal here is the TITLE alone.
    item_text_instruction: true

    # D2: was silently using the movie templates — every Q-Former instruction
    # literally said "Represent this MOVIE..." while processing Amazon books.
    # WARNING: the shipped Stage-1/Stage-2 book checkpoints were pretrained with
    # item_noun=movie. Flipping this to "book" is only correct AFTER re-running
    # Stage 1 + Stage 2; otherwise Stage 3 serves wording the Q-Former never saw.
    # Set back to `movie` if you reuse the existing qformer_stage1_book ckpt.
    # (A loud "ITEM NOUN OVERRIDE" line is logged at init as a reminder.)
    item_noun: book

  rec_config:
    # Amazon-Book (CoLLM/BinLLM OOD split) — much sparser than ML-1M (839/3256),
    # which is the point: weak CF -> the LLM/Q-Former bridge has real headroom.
    user_num: 22967
    item_num: 34154
    embedding_size: 256
    pretrained_path: "/content/SigLLM/ckpt/mf_book/mf_model.pth"

  # Warm-init checkpoint. Step 2 overrides this with the Step 1 LoRA ckpt;
  # Step 1 overrides it to null. Leave null at top level so a bare config
  # build (e.g. an ablation run) does not silently load a warm-init.
  ckpt: null

datasets:
  book_ood:
    path: "/content/SigLLM/data/processed/amazon-book/"
    data_type: default
    build_info:
      storage: "/content/SigLLM/data/processed/amazon-book/"
      # CoLLM parity: CoLLM keeps ALL rows and zero-pads short histories (does
      # NOT drop <2-history like SeLLa). False -> test population matches CoLLM.
      match_sella_history_filter: false
      # Emit TargetItemIsCold per row (29.3% of test rows on book) and remap cold
      # history ids to the padding index so their soft tokens are dropped by the
      # existing mask (10.0% of book history tokens). Reads train_ood2.pkl once
      # and caches the id set as train_item_ids.npy — worth it here, that pickle
      # is 505 MB. Must be flipped together with `model.cold_item_token`.
      mark_cold_items: false
      # Validate on valid_small (6,437 rows) instead of valid (25,747). Per-epoch
      # eval was ~57% of Step-2 compute on book; this cuts epoch time ~1.75x.
      # CoLLM also validates on valid_small, so this is reference-parity.
      # NB it changes best-checkpoint selection -> hold it fixed across every run
      # you intend to compare (re-run the baseline on this setting too).
      valid_filename: valid_small_ood2.pkl

run:
  task: rec_pretrain
  # Pipeline scripts override this from `run.qformer_stage3_step{1,2}`.
  output_dir: "ckpt/qformer_stage3_default"
  device: "cuda"
  seed: 42
  rec_baseline:
    save_file: ${model.rec_config.pretrained_path}
    need_train: True
    warm_or_cold: "warm"
    seed: 2025
    # Standalone MF on Amazon-Book DOES reach AUC 0.7105 / uAUC 0.5543 (CoRA/CoLLM
    # paper, "Collab. -> MF" row). So our 0.571-then-collapse is broken, not normal.
    # Root cause found in CoLLM's own repo: their SAVED best book-MF checkpoint is
    # named "..._book_oodv2_best_model_d256lr-0.001wd1e-06.pth" -> lr=1e-3, wd=1e-6.
    # We were running wd=1e-4 — 100x too high. That is exactly the collapse driver:
    # once the sigmoid saturates and the BCE gradient vanishes, weight_decay drags
    # the embeddings to zero (train_loss freezes at ln2). At wd=1e-6 that pull is
    # 100x weaker, so the climb that reached 0.571 @ep10 should CONTINUE toward 0.71
    # instead of collapsing. Match CoLLM exactly: lr=1e-3, wd=1e-6, emb 256, bs 1024.
    lr: 1e-3
    wd: 1e-6
    embedding_size: ${model.rec_config.embedding_size}
    epoch: 5000
    eval_epoch: 1
    # Match CoLLM's book MF (patience 50). With wd=1e-6 the collapse is gone, so the
    # model climbs then eventually overfits — patience 50 catches the valid_auc peak
    # (which is the saved checkpoint) and stops. Watch [diag]: valid AUC should climb
    # toward ~0.71 and train_loss must NOT freeze at 0.6924 (=ln2 = re-collapse).
    patience: 50
    batch_size: 1024
  qformer_stage1:
    # BLIP-2 representation pretraining: ITC + ITM + ITG using the Q-Former's
    # own text branch (no external BERT). Item-item contrastive (w_ii) is a
    # SigLLM-specific addition for co-watch collaborative signal.
    seed: 2025
    # Stage-1 speed/convergence tune for A100-80GB (was 256/4 on T4). Contrastive
    # (ITC/II/UI) quality scales with #in-batch negatives, so a big batch both
    # speeds up (fewer steps/epoch) AND lifts val ITC@1 (sharper alignment, less
    # overfit). bs=2048 + lr=2e-4 DIVERGED (ITC@1 stuck ~0.017, L_itc frozen ~4.08):
    # contrastive can't take an 8x-scaled lr. Use bs=1024 (4x negatives, ~4x faster)
    # with the ORIGINAL lr=5e-5 (below) for stability.
    # Bumped 256->1024 to use spare VRAM: ~4x fewer steps/epoch (faster wall-clock)
    # and 4x in-batch negatives (sharper ITC/II/UI). lr stays 5e-5 (2e-4 diverged);
    # the dropout=0.2 added below covers the extra overfit risk from a bigger batch.
    batch_size: 1024
    num_workers: 8
    embedding_size: ${model.rec_config.embedding_size}
    user_num: ${model.rec_config.user_num}
    item_num: ${model.rec_config.item_num}
    num_queries: ${model.qformer_config.num_queries}
    num_heads: ${model.qformer_config.num_heads}
    num_layers: ${model.qformer_config.num_layers}
    qformer_d_model: ${model.qformer_config.qformer_d_model}
    qformer_output_dim: ${model.qformer_config.qformer_output_dim}
    qformer_text_model_name: ${model.qformer_config.qformer_text_model_name}
    max_instruction_length: ${model.qformer_config.max_instruction_length}
    item_pair_window: 2
    # Amazon-Book is ~10x larger than ML-1M — uncapped pairs blow up Stage-1
    # contrastive pretraining. Cap both (amz-book branch used 1M). Tune on Colab.
    max_item_item_pairs: 500000
    max_user_item_pairs: 500000
    include_user_item: True
    # Kept at the proven 5e-5: the 8x-scaled 2e-4 diverged with the big batch.
    lr: 5e-5
    w_itc: 1.0
    w_itm: 1.0
    w_itg: 1.0
    w_ii: 1.0
    w_ui: 1.0
    tau_itc: 0.07
    tau_ii: 0.05
    tau_ui: 0.07
    # OVERFIT FIX (book Stage-1 train ITC@1 0.94 vs val 0.10). The Q-Former + its
    # BERT text branch were trained with dropout=0.0 (adapter default; the script
    # never passed a dropout) and only wd=1e-3 — near-zero regularization on a
    # 4-layer/768-d transformer over sparse 34k-item book titles. Two pure-
    # regularization levers (NO architecture change, both training-only / off at
    # eval + downstream): enable dropout, and raise weight_decay 1e-3 -> 1e-2.
    dropout: 0.2
    weight_decay: 1e-2
    debug_batch: True
    debug_batch_max_steps: 10
    early_stopping_patience: 10
    early_stopping_min_delta: 1e-4
    best_checkpoint_name: "qformer_stage1_best_full.pt"
    best_qformer_weights_name: "qformer_stage1_best_qformer.pth"
    log_epoch: 1
    epoch: 100
    pretrained_rec_path: ${model.rec_config.pretrained_path}
    freeze_rec: True
    output_dir: "/content/SigLLM/ckpt/qformer_stage1_book/"

  qformer_stage2:
    # BLIP-2-style generative pretraining: train Q-Former + linear projection
    # on next-token LM of item-text captions with the LLM fully frozen (no LoRA).
    seed: 2025
    batch_size: 32
    num_workers: 4
    embedding_size: ${model.rec_config.embedding_size}
    user_num: ${model.rec_config.user_num}
    item_num: ${model.rec_config.item_num}
    num_queries: ${model.qformer_config.num_queries}
    num_heads: ${model.qformer_config.num_heads}
    num_layers: ${model.qformer_config.num_layers}
    qformer_d_model: ${model.qformer_config.qformer_d_model}
    qformer_output_dim: ${model.qformer_config.qformer_output_dim}
    qformer_text_model_name: ${model.qformer_config.qformer_text_model_name}
    max_instruction_length: ${model.qformer_config.max_instruction_length}
    llm_model_name: ${model.llm_model}
    pretrained_rec_path: ${model.rec_config.pretrained_path}
    qformer_ckpt_in: "${run.qformer_stage1.output_dir}${run.qformer_stage1.best_qformer_weights_name}"
    qformer_ckpt_out: "qformer_stage2_best_qformer.pth"
    proj_ckpt_out: "qformer_stage2_best_proj.pth"
    output_dir: "/content/SigLLM/ckpt/qformer_stage2_book_vicuna/"
    # lr 1e-4 -> 2e-4 (faster convergence, per the movie winning recipe) and
    # epoch 20 -> 30. Book Stage-2 is expensive (34k items) so we do NOT push to
    # movie's 80 (Stage-2 depth was shown not to lift downstream). wd + patience
    # kept at book values as requested.
    lr: 2e-4
    weight_decay: 1e-3
    epoch: 30
    log_epoch: 1
    max_caption_length: 64
    early_stopping_patience: 5
    early_stopping_min_delta: 1e-4

  qformer_stage3_step1:
    # CoLLM Step 1 — train LoRA only on text-only prompts (no `<ItemIDList>` /
    # `<TargetItemID>` placeholders). Q-Former + projection are frozen here;
    # they will be unfrozen in Step 2. Only Step 1-specific overrides live
    # here — everything else (optimizer schedule, warmup, batch sizes) is
    # inherited from the top-level `run.*` defaults.
    prompt_path: "/content/SigLLM/prompts/qformer_prompt_book_text_only.txt"
    output_dir: "/content/SigLLM/ckpt/qformer_stage3_step1_lora_book_vicuna/"
    best_ckpt_name: "checkpoint_best.pth"
    init_lr: 2e-4
    max_epoch: 5
    # Step-1 is text-only (no CF) so valid AUC/uAUC is ~chance and per-epoch eval
    # is wasted LLM-generation time. skip_eval trains straight through (no eval,
    # ~2x faster); the driver promotes the final-epoch checkpoint to best_ckpt_name
    # so Step-2 still loads it. Set false to restore per-epoch validation.
    skip_eval: true

  qformer_stage3_step2:
    # CoLLM Step 2 — train Q-Former + projection on the full prompt, LoRA
    # loaded frozen from the Step 1 best checkpoint. Symmetric in shape to
    # `qformer_stage3_step1`: only the keys that differ from the top-level
    # defaults are listed here.
    # Vicuna/CoLLM reproduction uses the VANILLA prompt (no <UserID>) — the
    # user-token was a documented negative result and CoLLM does not use it.
    prompt_path: "/content/SigLLM/prompts/qformer_prompt_book_vanilla.txt"
    output_dir: "/content/SigLLM/ckpt/qformer_stage3_step2_book_vicuna/"
    ckpt: "${run.qformer_stage3_step1.output_dir}${run.qformer_stage3_step1.best_ckpt_name}"
    init_lr: 3e-5
    # Must stay below init_lr: the top-level min_lr (8e-5) is ABOVE this stage's
    # init_lr (3e-5), which INVERTED the cosine schedule — LR climbed 3e-5 → 8e-5
    # over training instead of decaying. That is the mechanism behind the
    # user-conditioned trajectory (val peaks ~epoch 3, then declines as LR rises).
    min_lr: 3e-6
    max_epoch: 200

  # Optimization
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 8e-5
  warmup_lr: 1e-5
  weight_decay: 1e-3
  amp: True
  
  # Training Schedule
  max_epoch: 200
  iters_per_epoch: 400
  batch_size_train: 16
  batch_size_eval: 64
  num_workers: 4
  warmup_steps: 200

  # User-grouped batching for the per-user pairwise (uAUC) losses above. When
  # enabled, the train loader reorders samples so each batch holds
  # `items_per_user` interactions per user with mixed labels -> many same-user
  # (pos,neg) pairs for ranking_loss / align_rank_loss to act on.
  # enabled=false -> original random/distributed sampling (no behavior change).
  # Only affects map-style rec datasets (Stage 3); Stage 1/2 use their own loader.
  user_grouped_batch:
    enabled: true
    items_per_user: 8
    seed: 0

  # Workflow
  evaluate: False
  mode: "v2"
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test", "test_warm", "test_cold"]
  resume_ckpt_path: null

  # Distributed
  distributed: True
  world_size: 1
  dist_url: "env://"
