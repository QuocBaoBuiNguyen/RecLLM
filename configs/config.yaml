model:
  arch: mini_gpt4rec_v2
  model_type: pretrain_vicuna
  llama_model: "/content/SigLLM/ckpt/llm/base"
  prompt_path: "/content/SigLLM/prompts/qformer_prompt_movie.txt"
  prompt_template: "{}"
  
  freeze_rec: True
  freeze_proj: False
  freeze_lora: False
  
  max_txt_len: 1024
  end_sym: "###"
  ans_type: "v2"
  
  proj_token_num: ${model.qformer_config.num_queries}
  proj_drop: 0
  proj_mid_times: 4
  
  rec_model: "MF"
  user_num: -100
  item_num: -100

  lora_config:
    use_lora: False
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05

  qformer_config:
    use_qformer: True
    qformer_ckpt: "${run.qformer_stage1.output_dir}${run.qformer_stage1.best_qformer_weights_name}" # Exported best QFormer weights from stage 1 for stage 2
    qformer_d_model: null # Derived from LLaMA hidden size when using LLaMA embedding instructions
    num_queries: 8
    num_heads: 8
    num_layers: 2

  rec_config:
    user_num: 839
    item_num: 3256
    embedding_size: 256    
    pretrained_path: "/content/SigLLM/ckpt/mf/mf_model.pth"

  ckpt: null

datasets:
  movie_ood:
    path: "/content/SigLLM/data/processed/ml-1m/"
    data_type: default
    build_info:
      storage: "/content/SigLLM/data/processed/ml-1m/"

run:
  task: rec_pretrain
  output_dir: "ckpt/qformer_stage2_llm_finetune"
  device: "cuda"
  seed: 42
  rec_baseline:
    save_file: ${model.rec_config.pretrained_path}
    need_train: True
    warm_or_cold: "warm"
    seed: 2025
    lr: 1e-3
    wd: 1e-4
    embedding_size: ${model.rec_config.embedding_size}
    epoch: 5000
    eval_epoch: 1
    patience: 100
    batch_size: 1024
  qformer_stage1:
    seed: 2025
    batch_size: 256
    num_workers: 4
    embedding_size: ${model.rec_config.embedding_size}
    user_num: ${model.rec_config.user_num}
    item_num: ${model.rec_config.item_num}
    num_queries: ${model.qformer_config.num_queries}
    num_heads: ${model.qformer_config.num_heads}
    num_layers: ${model.qformer_config.num_layers}
    item_pair_window: 2
    max_item_item_pairs: null
    max_user_item_pairs: null
    include_user_item: False
    lr: 2e-4
    w_ui: 0.0
    w_it: 1.0
    w_ii: 1.0
    tau_ui: 0.05
    tau_ii: 0.05
    tau_it: 0.10
    weight_decay: 1e-3
    debug_batch: True
    debug_batch_max_steps: 10
    early_stopping_patience: 10
    early_stopping_min_delta: 1e-4
    best_checkpoint_name: "qformer_stage1_best_full.pt"
    best_qformer_weights_name: "qformer_stage1_best_qformer.pth"
    log_epoch: 1
    epoch: 100
    llama_model_name: ${model.llama_model}
    pretrained_rec_path: ${model.rec_config.pretrained_path}
    freeze_rec: True
    freeze_text_encoder: True
    output_dir: "/content/SigLLM/ckpt/qformer_stage1/"
  
  # Optimization
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 8e-5
  warmup_lr: 1e-5
  weight_decay: 1e-3
  amp: True
  
  # Training Schedule
  max_epoch: 200
  iters_per_epoch: 400
  batch_size_train: 16
  batch_size_eval: 64
  num_workers: 4
  warmup_steps: 200
  
  # Workflow
  evaluate: False
  mode: "v2"
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["test", "valid"]
  resume_ckpt_path: null

  # Distributed
  distributed: True
  world_size: 1
  dist_url: "env://"
