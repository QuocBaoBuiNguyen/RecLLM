name: sigllm
channels:
  - conda-forge
  - defaults
dependencies:
  # Python 3.11 — required by Unsloth's transitive deps (torchao, recent
  # transformers). PEP 604 `X | None` syntax used by torchao>=0.13 is a
  # syntax error on Python 3.9/3.10-, so we cannot go lower.
  - python=3.11
  - pip
  - pycocotools
  - pip:
      # ---- Core ML stack ----
      # torch/torchvision: leave unpinned so pip resolves the cu* wheel that
      # matches the host CUDA driver. Unsloth needs torch>=2.4 + torchvision
      # whose minor matches torch (e.g. torch 2.8 → torchvision 0.23).
      - "torch>=2.4"
      - "torchvision>=0.23"
      - "torchaudio>=2.4"

      # ---- HuggingFace stack pinned to Unsloth-compatible window ----
      - "transformers>=4.46,<4.55"
      - "accelerate>=0.33"
      - "peft>=0.11"
      - "tokenizers>=0.20"
      - "huggingface-hub>=0.24"
      - "datasets>=2.20"

      # ---- Quantization + Unsloth ----
      - "bitsandbytes>=0.43"
      - "unsloth>=2025.7"
      # unsloth-zoo pulled transitively; pinning to avoid the >=0.13 torchao
      # conflict that breaks Python<3.10 envs.
      - "unsloth-zoo>=2025.7"

      # ---- Config / data / utils ----
      - omegaconf==2.3.0
      - pandas
      - scikit-learn
      - scipy
      - numpy
      - webdataset
      - timm
      - rich
      - sentencepiece
      - protobuf
      - tqdm
      - psutil
      - filelock
      - pyyaml

      # ---- Optional but used in pipeline ----
      - matplotlib
      - tenacity
      - notebook
      - wandb
